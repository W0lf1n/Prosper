# The demo — the sandbox a stranger can be handed a phone with (Q74).
#
# The same web image, built with `VITE_DEMO=1`: the app opens on a sample
# ledger and Začít znovu in Settings wipes back to it. No API and no database.
# Nothing anybody types here reaches anything, and there is nothing to pair
# with — the container's nginx answers 502 on `/api/`, which is what the app
# expects from a server that is not there.
#
# A second compose project beside the real one, on its own loopback port; the
# host's nginx gives it its own domain (`nginx/demo.conf.example`).
#
#     docker compose -f docker-compose.demo.yml up -d --build
#
# `deploy.sh` runs it after the real deployment when `DEPLOY_DEMO=1` is in
# `.env`, so a push to master updates both.
name: prosper-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEMO: '1'
    restart: unless-stopped
    logging: *logging
    ports:
      - '127.0.0.1:${PROSPER_DEMO_PORT:-8081}:80'
