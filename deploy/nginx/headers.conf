# Headers every response gets, in a file because of an nginx trap.
#
# `add_header` does not merge down: a `location` that declares one of its own
# **replaces** every `add_header` inherited from the server block rather than
# adding to it. So the two locations that set their own `Cache-Control` would
# silently lose the three lines below — which is the sort of thing nobody
# notices, because a missing security header looks exactly like a present one.
#
# Including the same file everywhere is the fix that stays fixed.

# Stop a browser guessing a content type it was told.
add_header X-Content-Type-Options nosniff always;

# The ledger is nobody's business. Do not name it in an outbound Referer.
add_header Referrer-Policy same-origin always;

# Not a full CSP — the theme is applied by an inline script before first paint
# (`app.html`), so `script-src` would need a hash kept in step with it by hand,
# and a policy that drifts is a policy that gets switched off. This is the half
# that costs nothing and never drifts.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
