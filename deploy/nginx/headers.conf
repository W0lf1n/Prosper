# Headers every response gets, in a file because of an nginx trap.
#
# `add_header` does not merge down: a `location` that declares one of its own
# **replaces** every `add_header` inherited from the server block rather than
# adding to it. So the two locations that set their own `Cache-Control` would
# silently lose the three lines below — which is the sort of thing nobody
# notices, because a missing security header looks exactly like a present one.
#
# Including the same file everywhere is the fix that stays fixed.

# Stop a browser guessing a content type it was told.
add_header X-Content-Type-Options nosniff always;

# The ledger is nobody's business. Do not name it in an outbound Referer.
add_header Referrer-Policy same-origin always;

# And not in anybody's index, snippet, cache or training set. `robots.txt`
# turns crawlers away at the door; this is for whatever fetched a response
# anyway, and unlike the <meta> in app.html it covers the API's JSON and the
# static files too. `noai` / `noimageai` are not in any standard — they are
# the opt-out a few crawlers read, and they cost nothing to say.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;

# Once a browser has seen the app over TLS it never asks for it over plain HTTP
# again — a year of it, which is what makes a captive portal's downgrade land
# on a refusal rather than on the ledger. Set here with the others rather than
# in the host's file, because certbot rewrites that one and this header rides
# through its proxy untouched. A browser ignores it over plain HTTP, which is
# the only way this container is ever reached directly. No `includeSubDomains`:
# the domain's other names are not this app's to promise for.
add_header Strict-Transport-Security "max-age=31536000" always;

# Not a full CSP — the theme is applied by an inline script before first paint
# (`app.html`), so `script-src` would need a hash kept in step with it by hand,
# and a policy that drifts is a policy that gets switched off. This is the half
# that costs nothing and never drifts.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
